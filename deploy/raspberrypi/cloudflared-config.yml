# /etc/cloudflared/config.yml — locally managed tunnel (created with the cloudflared CLI,
# not in the Zero Trust dashboard). Replace <TUNNEL_ID> with the id from `cloudflared tunnel create`.
tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: expensesbot.redlightforge.com
    service: http://localhost:8080
  - service: http_status:404
