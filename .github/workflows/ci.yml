name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ExpensesBot.slnx

      - name: Build
        run: dotnet build ExpensesBot.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test ExpensesBot.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  # Continuous delivery: after the tests pass on master, build linux/arm64 images
  # for the Raspberry Pi and push them to GHCR. The Pi pulls them by itself
  # (deploy/raspberrypi/update.sh on a systemd timer), so CI never needs a way in.
  publish-images:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Native arm64 runner: no QEMU emulation, the build takes minutes instead of tens.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: ExpensesBot.Api/Dockerfile
          - service: worker
            dockerfile: ExpensesBot.Worker/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        # GHCR needs lower-case names.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/expensesbot-${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
